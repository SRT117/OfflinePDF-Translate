name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install locked dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.lock
      - name: Install dependencies (Linux / macOS)
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        env:
          OFFLINEPDF_DATA_DIR: ${{ runner.temp }}/offlinepdf-test-data
        run: python -m unittest discover -s tests
