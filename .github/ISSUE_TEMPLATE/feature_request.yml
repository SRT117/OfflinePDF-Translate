name: Feature Request
description: Suggest a new feature or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      placeholder: Describe the use case or pain point you want to address
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      placeholder: Briefly describe the expected behavior or UX
    validations:
      required: true
